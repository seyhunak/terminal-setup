name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck install.sh scripts/*.sh git/hooks/pre-commit

      - name: fish syntax
        run: |
          brew install fish
          for f in fish/config.fish fish/conf.d/*.fish fish/functions/*.fish; do
            echo "== $f"
            fish --no-execute "$f"
          done

      - name: json parses
        run: |
          # Strip // comments and trailing commas (JSONC), then validate.
          for f in opencode/opencode.jsonc claude/settings.shared.json copilot/settings.shared.json; do
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, re, sys
          src = open(sys.argv[1]).read()
          src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
          src = re.sub(r'^\s*//.*$', '', src, flags=re.M)
          src = re.sub(r',(\s*[}\]])', r'\1', src)
          json.loads(src)
          print("OK")
          PY
          done

      - name: yaml parses
        run: |
          # The runner's python3 is externally managed (PEP 668) and has no
          # PyYAML, so use a throwaway venv rather than touching the system.
          python3 -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install --quiet --disable-pip-version-check pyyaml
          for f in aider/aider.conf.yml; do
            echo "== $f"
            /tmp/ci-venv/bin/python -c "import sys,yaml; yaml.safe_load(open(sys.argv[1])); print('OK')" "$f"
          done

      - name: toml parses
        run: |
          for f in codex/dotfiles.config.toml starship/starship.toml herdr/config.toml; do
            echo "== $f"
            python3 -c "import sys,tomllib; tomllib.load(open(sys.argv[1],'rb')); print('OK')" "$f"
          done

      - name: herdr baseline stays honest
        run: |
          # herdr is installed by its own installer, NOT the Brewfile: ~/.local/bin
          # precedes /opt/homebrew/bin, so a brew copy is shadowed and warns on
          # every brew call. Keep it out of the Brewfile.
          if grep -qE '^\s*(brew|cask) "herdr"' Brewfile; then
            echo "herdr must not be in the Brewfile — ~/.local/bin shadows it (see herdr/README.md)" >&2
            exit 1
          fi
          # Panes should get fish, not the launchd agent's /bin/zsh.
          grep -q 'default_shell = "/opt/homebrew/bin/fish"' herdr/config.toml

      - name: codex baseline stays inside the sandbox
        run: |
          # A shared codex profile must never widen the sandbox or skip approvals.
          # Strip comments first — the file explains these values in prose.
          body="$(grep -v '^\s*#' codex/dotfiles.config.toml)"
          echo "$body" | grep -q 'sandbox_mode = "workspace-write"'
          echo "$body" | grep -q 'approval_policy = "on-request"'
          if echo "$body" | grep -qE 'danger-full-access|approval_policy *= *"never"'; then
            echo "codex baseline widens the sandbox or disables approvals" >&2
            exit 1
          fi

      - name: Brewfile parses
        run: |
          # `brew bundle check` exits 1 both for a malformed Brewfile and for
          # unmet dependencies, and unmet is always true on a clean runner.
          # Only a parse error should fail the build.
          if brew bundle check --file=Brewfile --no-upgrade 2>&1 | grep -q 'Invalid Brewfile'; then
            echo "Brewfile does not parse:" >&2
            brew bundle check --file=Brewfile --no-upgrade 2>&1 | grep 'Invalid Brewfile' >&2
            exit 1
          fi
          echo "Brewfile parses (unmet deps expected on a clean runner)"

      - name: no hardcoded clone location
        run: |
          # Everything must resolve the repo from its own location.
          ! grep -rn 'HOME/dotfiles' install.sh scripts/ \
            || (echo "hardcoded clone path in install.sh/scripts — use DOTFILES_DIR" && exit 1)

  installer-dry-run:
    name: installer dry run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n install.sh
      - name: installer runs to completion
        # brew/stellar are not available on the runner, but the symlink and
        # backup logic must still be exercised end to end.
        run: |
          export PATH="$PATH:/usr/local/bin:/opt/homebrew/bin"
          ./install.sh
      - name: symlinks resolve
        run: |
          for f in \
            "$HOME/.config/ghostty/config" \
            "$HOME/.tmux.conf" \
            "$HOME/.config/opencode/opencode.jsonc" \
            "$HOME/.codex/dotfiles.config.toml" \
            "$HOME/.aider.conf.yml" \
            "$HOME/.config/fish/config.fish"; do
            echo "== $f"
            test -e "$f" || { echo "broken symlink: $f"; exit 1; }
          done
          git config --global --get-all include.path | grep -q "$GITHUB_WORKSPACE"
