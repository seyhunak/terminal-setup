# ~/.tmux.conf — agentic dev: persistent sessions, vi keys, truecolor for Ghostty
set -g default-shell /opt/homebrew/bin/fish
set -g default-command /opt/homebrew/bin/fish

# Truecolor (Ghostty advertises xterm-ghostty)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-rename off

# Vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Splits keep cwd; quick reload
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Pane titles (agent-duo sets leader/worker/git) so borders stay readable
set -g pane-border-status top
set -g pane-border-format " #{pane_index}:#pane_title} "

# agent-duo layout: jump straight to a pane by role
bind 1 select-pane -t :.1
bind 2 select-pane -t :.2
bind 3 select-pane -t :.3

# Catppuccin Latte accents (readable on light + dark Ghostty)
set -g status-style "bg=#dce0e8,fg=#4c4f69"
set -g window-status-current-style "bg=#7287fd,fg=#eff1f5,bold"
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#7287fd"
set -g message-style "bg=#7287fd,fg=#eff1f5"
set -g status-left "#[bold] #S "
set -g status-right " %R %d-%b "

# resurrect/continuum persistence (install via TPM if wanted)
